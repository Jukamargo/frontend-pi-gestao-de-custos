services:
  - type: web
    name: gestao-de-custos-frontend
    runtime: static
    rootDir: intelligent-cost-management
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
