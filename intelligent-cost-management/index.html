<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f9" />
    <script>
      // Aplicar o tema antes de carregar a interface evita um clarão na abertura.
      ;(() => {
        let preference
        try {
          preference = localStorage.getItem('gestao-de-custos:theme')
        } catch {
          // O tema do sistema continua disponível sem armazenamento local.
        }
        const theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#0b1422' : '#f4f6f9'
      })()
    </script>
    <meta
      name="description"
      content="Gestão de custos — Inovanet: projeto de automação de rotinas e integração das ferramentas principais a um chatbot para responder às dúvidas da equipe."
    />
    <title>Gestão de custos | Automação e chatbot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
